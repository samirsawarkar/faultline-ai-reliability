  <text x="441.4200000000001" y="401.87" class="card-metric">pass³: <tspan font-weight="700" fill="#047857">22.67%</tspan> [16.7%, 30.0%] · pass@1: 63.11%</text>
  <rect x="441.4200000000001" y="411.87" width="235" height="16" rx="8" fill="#d1fae5"/>
  <text x="449.4200000000001" y="423.87" class="badge-text" fill="#065f46">★ 11.3× Higher Reliability · 18.3× Lower Cost</text>
