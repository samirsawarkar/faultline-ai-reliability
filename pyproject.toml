[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "faultline-phase2"
version = "0.1.0"
description = "FAULTLINE Phase 2 — Real model reliability laboratory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13",
    "litellm==1.98.0",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["faultline_p2*"]
