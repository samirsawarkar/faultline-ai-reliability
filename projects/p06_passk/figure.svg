  <line x1="647.0" y1="425.586" x2="647.0" y2="442.688" stroke="#111827" stroke-width="2.0" stroke-linecap="round"/>
  <line x1="640.0" y1="425.586" x2="654.0" y2="425.586" stroke="#111827" stroke-width="2.0" stroke-linecap="round"/>
