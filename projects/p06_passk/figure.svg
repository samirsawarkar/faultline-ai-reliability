  <rect x="180" y="587" width="16" height="14" fill="#e65100" rx="3"/>
  <text x="204" y="599" class="legend-text">Naive Independence (pass@1)³</text>
  <rect x="485" y="587" width="16" height="14" fill="#1e40af" rx="3"/>
  <text x="508" y="599" class="legend-text">Measured pass³ (All 3 Trials Pass, with Wilson 95% CI)</text>
  <line x1="890" y1="594" x2="920" y2="594" stroke="#4b5563" stroke-dasharray="4,3" stroke-width="2"/>
  <text x="930" y="599" class="legend-text">pass@1 Baseline Marker</text>
