  <line x1="864.0" y1="445.0" x2="986.0" y2="445.0" stroke="#4b5563" stroke-dasharray="4,3" stroke-width="1.8"/>
  <text x="990.0" y="449.0" class="tick-label" text-anchor="start">pass@1=0.0%</text>
  <!-- R6 Badge -->
