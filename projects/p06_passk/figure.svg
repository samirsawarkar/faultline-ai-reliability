  <line x1="957.0" y1="436.5" x2="957.0" y2="445.0" stroke="#111827" stroke-width="2.0" stroke-linecap="round"/>
  <line x1="950.0" y1="436.5" x2="964.0" y2="436.5" stroke="#111827" stroke-width="2.0" stroke-linecap="round"/>
  <line x1="950.0" y1="445.0" x2="964.0" y2="445.0" stroke="#111827" stroke-width="2.0" stroke-linecap="round"/>
