  <text x="925.0" y="482" class="badge-text" fill="#b91c1c" text-anchor="middle">Boundary Floor / Upstream Timeout</text>
  <text x="925.0" y="507" class="model-title" text-anchor="middle">R6: Frontier Anchor</text>
  <text x="925.0" y="525" class="model-sub" text-anchor="middle">deepseek-v4-pro</text>
