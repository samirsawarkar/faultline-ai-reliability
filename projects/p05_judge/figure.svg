<svg width="900" height="520" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 17px; font-weight: 600; fill: #1a1a1a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #666666; }
    .axis { stroke: #cccccc; stroke-width: 1; }
    .grid { stroke: #eeeeee; stroke-dasharray: 4,4; }
    .thresh { stroke: #d9534f; stroke-width: 1.5; stroke-dasharray: 6,4; }
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #333333; }
    .val { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; }
    .legend { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #555555; }
    .tag-thresh { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; fill: #d9534f; }
  </style>
  <!-- Title -->
  <text x="450.0" y="28" class="title" text-anchor="middle">P5 Judge Validation: Cohen's κ Agreement on Frozen Test Split (n=60)</text>
  <text x="450.0" y="46" class="subtitle" text-anchor="middle">Evaluator Architecture: Code Assertions + LLM Judge (z-ai/glm-5.3) vs Human Ground Truth</text>
  <!-- Y-Axis Grid & Labels (Kappa -0.2 to 1.0) -->
  <line x1="60" y1="360.0" x2="860" y2="360.0" class="grid"/>
  <text x="50" y="364.0" class="label" text-anchor="end">κ = 0.0</text>
  <line x1="60" y1="303.0" x2="860" y2="303.0" class="grid"/>
  <text x="50" y="307.0" class="label" text-anchor="end">κ = 0.2</text>
  <line x1="60" y1="246.0" x2="860" y2="246.0" class="grid"/>
  <text x="50" y="250.0" class="label" text-anchor="end">κ = 0.4</text>
  <line x1="60" y1="189.0" x2="860" y2="189.0" class="grid"/>
  <text x="50" y="193.0" class="label" text-anchor="end">κ = 0.6</text>
  <line x1="60" y1="132.0" x2="860" y2="132.0" class="grid"/>
  <text x="50" y="136.0" class="label" text-anchor="end">κ = 0.8</text>
  <line x1="60" y1="75.0" x2="860" y2="75.0" class="grid"/>
  <text x="50" y="79.0" class="label" text-anchor="end">κ = 1.0</text>
  <!-- H3 Threshold kappa = 0.70 -->
  <line x1="60" y1="160.5" x2="860" y2="160.5" class="thresh"/>
  <text x="855" y="156.5" class="tag-thresh" text-anchor="end">H3 Threshold (κ ≥ 0.70)</text>
  <line x1="60" y1="360" x2="860" y2="360" class="axis"/>
  <!-- Mode INFRASTRUCTURE_RATE_LIMIT Bar -->
  <rect x="87.33333333333334" y="75.0" width="52" height="285.0" fill="#2b6cb0" rx="3"/>
  <text x="113.33333333333334" y="69.0" class="val" fill="#2b6cb0" text-anchor="middle">κ=1.00</text>
  <text x="113.33333333333334" y="378" class="label" font-weight="600" text-anchor="middle">Infrastructure Rate</text>
  <text x="113.33333333333334" y="392" class="label" font-weight="600" text-anchor="middle">Limit</text>
  <text x="113.33333333333334" y="406" class="legend" text-anchor="middle">[Code] Sens=100%</text>
  <!-- Mode INFRASTRUCTURE_SERVER_ERROR Bar -->
  <rect x="174.00000000000003" y="75.0" width="52" height="285.0" fill="#2b6cb0" rx="3"/>
  <text x="200.00000000000003" y="69.0" class="val" fill="#2b6cb0" text-anchor="middle">κ=1.00</text>
  <text x="200.00000000000003" y="378" class="label" font-weight="600" text-anchor="middle">Infrastructure Server</text>
  <text x="200.00000000000003" y="392" class="label" font-weight="600" text-anchor="middle">Error</text>
  <text x="200.00000000000003" y="406" class="legend" text-anchor="middle">[Code] Sens=100%</text>
  <!-- Mode RETRIEVAL_FAILURE_ABSTENTION Bar -->
  <rect x="260.6666666666667" y="75.0" width="52" height="285.0" fill="#9467bd" rx="3"/>
  <text x="286.6666666666667" y="69.0" class="val" fill="#9467bd" text-anchor="middle">κ=1.00</text>
  <text x="286.6666666666667" y="378" class="label" font-weight="600" text-anchor="middle">Retrieval Failure</text>
  <text x="286.6666666666667" y="392" class="label" font-weight="600" text-anchor="middle">Abstention</text>
  <text x="286.6666666666667" y="406" class="legend" text-anchor="middle">[Judge] Sens=100%</text>
  <!-- Mode ANSWER_EXTRACTION_TRUNCATION Bar -->
  <rect x="347.3333333333333" y="75.0" width="52" height="285.0" fill="#9467bd" rx="3"/>
  <text x="373.3333333333333" y="69.0" class="val" fill="#9467bd" text-anchor="middle">κ=1.00</text>
  <text x="373.3333333333333" y="378" class="label" font-weight="600" text-anchor="middle">Answer Extraction</text>
  <text x="373.3333333333333" y="392" class="label" font-weight="600" text-anchor="middle">Truncation</text>
  <text x="373.3333333333333" y="406" class="legend" text-anchor="middle">[Judge] Sens=100%</text>
  <!-- Mode MULTI_HOP_DIRECTION_ERROR Bar -->
  <rect x="434.0" y="75.0" width="52" height="285.0" fill="#9467bd" rx="3"/>
  <text x="460.0" y="69.0" class="val" fill="#9467bd" text-anchor="middle">κ=1.00</text>
  <text x="460.0" y="378" class="label" font-weight="600" text-anchor="middle">Multi Hop</text>
  <text x="460.0" y="392" class="label" font-weight="600" text-anchor="middle">Direction Error</text>
  <text x="460.0" y="406" class="legend" text-anchor="middle">[Judge] Sens=100%</text>
  <!-- Mode MALFORMED_TOOL_CALL Bar -->
  <rect x="520.6666666666667" y="291.8565" width="52" height="68.1435" fill="#2b6cb0" rx="3"/>
  <text x="546.6666666666667" y="285.8565" class="val" fill="#2b6cb0" text-anchor="middle">κ=0.24</text>
  <text x="546.6666666666667" y="378" class="label" font-weight="600" text-anchor="middle">Malformed Tool</text>
  <text x="546.6666666666667" y="392" class="label" font-weight="600" text-anchor="middle">Call</text>
  <text x="546.6666666666667" y="406" class="legend" text-anchor="middle">[Code] Sens=100%</text>
  <!-- Mode MULTI_HOP_TRAVERSAL_EXHAUSTION Bar -->
  <rect x="607.3333333333334" y="360.0" width="52" height="0.0" fill="#2b6cb0" rx="3"/>
  <text x="633.3333333333334" y="354.0" class="val" fill="#2b6cb0" text-anchor="middle">κ=0.00</text>
  <text x="633.3333333333334" y="378" class="label" font-weight="600" text-anchor="middle">Multi Hop</text>
  <text x="633.3333333333334" y="392" class="label" font-weight="600" text-anchor="middle">Traversal Exhaustion</text>
  <text x="633.3333333333334" y="406" class="legend" text-anchor="middle">[Code] Sens=100%</text>
  <!-- Mode PREMATURE_STOP_WRONG_HOP Bar -->
  <rect x="694.0000000000001" y="360.0" width="52" height="0.0" fill="#9467bd" rx="3"/>
  <text x="720.0000000000001" y="354.0" class="val" fill="#9467bd" text-anchor="middle">κ=0.00</text>
  <text x="720.0000000000001" y="378" class="label" font-weight="600" text-anchor="middle">Premature Stop</text>
  <text x="720.0000000000001" y="392" class="label" font-weight="600" text-anchor="middle">Wrong Hop</text>
  <text x="720.0000000000001" y="406" class="legend" text-anchor="middle">[Judge] Sens=0%</text>
  <!-- Mode OVERCONSTRAINED_SEARCH_LOOP Bar -->
  <rect x="780.6666666666667" y="360.0" width="52" height="0.0" fill="#9467bd" rx="3"/>
  <text x="806.6666666666667" y="354.0" class="val" fill="#9467bd" text-anchor="middle">κ=-0.03</text>
  <text x="806.6666666666667" y="378" class="label" font-weight="600" text-anchor="middle">Overconstrained Search</text>
  <text x="806.6666666666667" y="392" class="label" font-weight="600" text-anchor="middle">Loop</text>
  <text x="806.6666666666667" y="406" class="legend" text-anchor="middle">[Judge] Sens=0%</text>
  <!-- Legend -->
  <rect x="110" y="463" width="14" height="12" fill="#2b6cb0" rx="2"/>
  <text x="130" y="473" class="legend">Deterministic Code Assertion Evaluator</text>
  <rect x="420" y="463" width="14" height="12" fill="#9467bd" rx="2"/>
  <text x="440" y="473" class="legend">LLM Judge Evaluator (z-ai/glm-5.3)</text>
  <line x1="750" y1="469" x2="780" y2="469" class="thresh"/>
  <text x="790" y="473" class="legend">H3 Target (κ ≥ 0.70)</text>
</svg>