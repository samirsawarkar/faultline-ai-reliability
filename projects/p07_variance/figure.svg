<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420">
  <rect width="900" height="420" fill="#ffffff"/>

  <!-- Left Panel -->
  <text x="40" y="45" font-family="Helvetica, Inter, sans-serif" font-size="16" font-weight="600" fill="#1e293b">Grounded pass rate, same model, two gateways</text>

  <!-- Left Panel Grid & Axes -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="90" y1="310.0" x2="480" y2="310.0" />
    <line x1="90" y1="255.0" x2="480" y2="255.0" />
    <line x1="90" y1="200.0" x2="480" y2="200.0" />
    <line x1="90" y1="145.0" x2="480" y2="145.0" />
    <line x1="90" y1="90.0" x2="480" y2="90.0" />
  </g>
  <g font-family="Helvetica, Inter, sans-serif" font-size="11" fill="#64748b" text-anchor="end">
    <text x="82" y="314.0">0.80</text>
    <text x="82" y="259.0">0.85</text>
    <text x="82" y="204.0">0.90</text>
    <text x="82" y="149.0">0.95</text>
    <text x="82" y="94.0">1.00</text>
  </g>

  <!-- Y-axis line -->
  <line x1="90" y1="90" x2="90" y2="310" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Left Panel Bars -->
  <!-- aicredits -->
  <rect x="180" y="134.0" width="80" height="176.0" fill="#4f6d8a" fill-opacity="0.25" stroke="#4f6d8a" stroke-width="1.5"/>
  <text x="220.0" y="122.0" font-family="Helvetica, Inter, sans-serif" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">0.9600</text>
  <text x="220.0" y="328" font-family="Helvetica, Inter, sans-serif" font-size="12" font-weight="500" fill="#1e293b" text-anchor="middle">AI Credits</text>
  <text x="220.0" y="342" font-family="Helvetica, Inter, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">n=150</text>

  <!-- aicredits Wilson error bar -->
  <line x1="220.0" y1="183.0" x2="220.0" y2="110.3" stroke="#1e293b" stroke-width="1.2"/>
  <line x1="210.0" y1="110.3" x2="230.0" y2="110.3" stroke="#1e293b" stroke-width="1.2"/>
  <line x1="210.0" y1="183.0" x2="230.0" y2="183.0" stroke="#1e293b" stroke-width="1.2"/>

  <!-- agy -->
  <rect x="340" y="207.4" width="80" height="102.6" fill="#4f6d8a" fill-opacity="0.25" stroke="#4f6d8a" stroke-width="1.5"/>
  <text x="380.0" y="195.4" font-family="Helvetica, Inter, sans-serif" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">0.8933</text>
  <text x="380.0" y="328" font-family="Helvetica, Inter, sans-serif" font-size="12" font-weight="500" fill="#1e293b" text-anchor="middle">Antigravity (agy)</text>
  <text x="380.0" y="342" font-family="Helvetica, Inter, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">n=150</text>

  <!-- agy Wilson error bar -->
  <line x1="380.0" y1="272.8" x2="380.0" y2="163.4" stroke="#1e293b" stroke-width="1.2"/>
  <line x1="370.0" y1="163.4" x2="390.0" y2="163.4" stroke="#1e293b" stroke-width="1.2"/>
  <line x1="370.0" y1="272.8" x2="390.0" y2="272.8" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Left Panel Caption -->
  <text x="40" y="368" font-family="Helvetica, Inter, sans-serif" font-size="11" fill="#64748b">Wilson 95% intervals overlap on [0.9155, 0.9333] — disjoint-CI criterion not met</text>

  <!-- Divider Line between panels -->
  <line x1="535" y1="40" x2="535" y2="370" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Right Panel -->
  <text x="560" y="45" font-family="Helvetica, Inter, sans-serif" font-size="16" font-weight="600" fill="#1e293b">Paired discordance, McNemar</text>

  <!-- Column/Row Headers for 2x2 table -->
  <g font-family="Helvetica, Inter, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    <text x="665.0" y="98">agy Pass</text>
    <text x="775.0" y="98">agy Fail</text>
  </g>
  <g font-family="Helvetica, Inter, sans-serif" font-size="11" fill="#64748b" text-anchor="end">
    <text x="598" y="151.5">AI Credits Pass</text>
    <text x="598" y="226.5">AI Credits Fail</text>
  </g>

  <!-- 2x2 Grid cells -->
  <!-- Top-left: both pass (130) -->
  <rect x="610" y="110" width="110" height="75" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="665.0" y="146" font-family="Helvetica, Inter, sans-serif" font-size="20" font-weight="600" fill="#1e293b" text-anchor="middle">130</text>
  <text x="665.0" y="164" font-family="Helvetica, Inter, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">both pass</text>

  <!-- Top-right: aicredits only (14) - Discordant, shaded -->
  <rect x="720" y="110" width="110" height="75" fill="#e8eef4" stroke="#4f6d8a" stroke-width="1.5"/>
  <text x="775.0" y="146" font-family="Helvetica, Inter, sans-serif" font-size="20" font-weight="600" fill="#1e293b" text-anchor="middle">14</text>
  <text x="775.0" y="164" font-family="Helvetica, Inter, sans-serif" font-size="10" font-weight="500" fill="#4f6d8a" text-anchor="middle">aicredits only</text>

  <!-- Bottom-left: agy only (4) - Discordant, shaded -->
  <rect x="610" y="185" width="110" height="75" fill="#e8eef4" stroke="#4f6d8a" stroke-width="1.5"/>
  <text x="665.0" y="221" font-family="Helvetica, Inter, sans-serif" font-size="20" font-weight="600" fill="#1e293b" text-anchor="middle">4</text>
  <text x="665.0" y="239" font-family="Helvetica, Inter, sans-serif" font-size="10" font-weight="500" fill="#4f6d8a" text-anchor="middle">agy only</text>

  <!-- Bottom-right: neither (2) -->
  <rect x="720" y="185" width="110" height="75" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="775.0" y="221" font-family="Helvetica, Inter, sans-serif" font-size="20" font-weight="600" fill="#1e293b" text-anchor="middle">2</text>
  <text x="775.0" y="239" font-family="Helvetica, Inter, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">neither</text>

  <!-- Right Panel Captions -->
  <text x="560" y="292" font-family="Helvetica, Inter, sans-serif" font-size="11" fill="#64748b">b=14, c=4, exact p=0.0309 — significant at 0.05</text>
  <text x="560" y="310" font-family="Helvetica, Inter, sans-serif" font-size="11" fill="#64748b">Latency p95: agy 2.3x AI Credits</text>

  <!-- Footer -->
  <line x1="40" y1="390" x2="860" y2="390" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="407" font-family="Helvetica, Inter, sans-serif" font-size="10" fill="#64748b">FAULTLINE P7 · 150 matched scenarios · MEC v1.3 · spend $0.44</text>
</svg>
