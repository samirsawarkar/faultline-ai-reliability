name: Research CI

on:
  push:
    branches: [main]
    tags: ["v*-rc*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: full tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9.19", "3.11.9", "3.12.4"]
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the resolved dependency lock
        run: |
          python -m pip install pip==26.0.1
          python -m pip install -r requirements.txt

      - name: Run every isolated day suite
        run: make PY=python test

  research-reproduction:
    name: frozen eval + fast experiments + README traceability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.4"

      - name: Install the resolved dependency lock
        run: |
          python -m pip install pip==26.0.1
          python -m pip install -r requirements.txt

      - name: Run the CI-sized research reproduction
        run: make PY=python reproduce-fast

      - name: Require byte-identical committed evidence
        run: git diff --exit-code -- day07/evidence day21/evidence day25/evidence day26/evidence day27/evidence

  clean-container:
    name: digest-pinned clean-container reproduction
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build; the Dockerfile runs the full reproduction
        run: docker build --pull --tag faultline:0.27.0-rc1 .

      - name: Reproduce every headline inside the clean image
        run: docker run --rm --entrypoint python faultline:0.27.0-rc1 day27/scripts/reproduce_headlines.py
