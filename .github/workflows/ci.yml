name: Research CI

on:
  push:
    branches: [main]
    tags: ["v*-rc*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: full tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9.19", "3.11.9", "3.12.4"]
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the resolved dependency lock
        run: |
          python -m pip install pip==26.0.1
          python -m pip install -r requirements.txt

      - name: Run every isolated day suite
        run: make PY=python test

  research-reproduction:
    name: frozen eval + fast experiments + README traceability
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.4"

      - name: Install the resolved dependency lock
        run: |
          python -m pip install pip==26.0.1
          python -m pip install -r requirements.txt

      - name: Run the CI-sized research reproduction
        run: make PY=python reproduce-fast

      - name: Require byte-identical committed evidence
        run: git diff --exit-code -- day07/evidence day21/evidence day25/evidence day26/evidence

  clean-container:
    name: digest-pinned clean-container reproduction
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build; the Dockerfile runs the full reproduction
        run: docker build --pull --tag faultline:0.26.0-rc1 .
