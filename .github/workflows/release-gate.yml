name: release-gate

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      rung:
        description: "Model ladder rung to evaluate (e.g. R2)"
        required: true
        default: "R2"
        type: string
      confirm:
        description: "Confirm paid sweep execution"
        required: true
        default: false
        type: boolean

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-stub:
    name: release gate stub verification ($0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"

      - name: Install Phase 2 package and dependencies
        run: |
          python -m pip install pip==26.0.1
          python -m pip install -e .

      - name: Drill 1 - stub solver (expect PASS, exit 0)
        run: python projects/p11_release_gate/run.py --model stub:solver --band projects/p11_release_gate/band_stub.json --golden projects/p11_release_gate/golden.json

      - name: Drill 2 - stub wrong_answer (assert FAIL, exit 2)
        run: |
          set +e
          python projects/p11_release_gate/run.py --model stub:wrong_answer --band projects/p11_release_gate/band_stub.json --golden projects/p11_release_gate/golden.json
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 2 ]; then
            echo "Expected exit code 2, got $EXIT_CODE"
            exit 1
          fi
          echo "Drill 2 correctly exited with code 2"

  gate-live:
    name: release gate live candidate evaluation
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"

      - name: Install Phase 2 package and dependencies
        run: |
          python -m pip install pip==26.0.1
          python -m pip install -e .

      - name: Run live release gate
        env:
          AICREDITS_API_KEY: ${{ secrets.AICREDITS_API_KEY }}
          AICREDITS_BASE_URL: ${{ secrets.AICREDITS_BASE_URL }}
        run: |
          CONFIRM_FLAG=""
          if [ "${{ github.event.inputs.confirm }}" = "true" ]; then
            CONFIRM_FLAG="--confirm"
          fi
          python projects/p11_release_gate/run.py --model ${{ github.event.inputs.rung }} --band projects/p11_release_gate/band.json --golden projects/p11_release_gate/golden.json $CONFIRM_FLAG

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb99ba8afd # v4.1.4
        with:
          name: release-gate-report
          path: projects/p11_release_gate/report.json
