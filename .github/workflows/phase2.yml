name: phase2

on:
  push:
  pull_request:

concurrency:
  group: phase2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase2:
    name: phase 2 laboratory tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"

      - name: Install Phase 2 package and dependencies
        run: |
          python -m pip install pip==26.0.1
          python -m pip install -e .

      - name: Run Phase 2 test suite
        run: pytest tests/phase2 -q
